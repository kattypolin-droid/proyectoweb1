<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 01 - Galería de Productos Responsiva</title>
    <link href="plantilla/plantilla/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-4">Catálogo de Productos</h2>
        <!--
            xs (<576px):  1 tarjeta  -> col-12
            md (>=768px): 2 tarjetas -> col-md-6
            lg (>=992px): 3 tarjetas -> col-lg-4
            xl (>=1200px):4 tarjetas -> col-xl-3
        -->
        <div class="row g-4">

            <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Laptop Core i7</h5>
                        <p class="card-text text-muted">16GB RAM - 512GB SSD</p>
                        <span class="badge bg-success fs-6">S/ 3,499.00</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Monitor 24"</h5>
                        <p class="card-text text-muted">Full HD - 75Hz</p>
                        <span class="badge bg-success fs-6">S/ 599.00</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Teclado Mecánico</h5>
                        <p class="card-text text-muted">Switch Red - RGB</p>
                        <span class="badge bg-success fs-6">S/ 189.00</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Mouse Inalámbrico</h5>
                        <p class="card-text text-muted">2.4Ghz - Ergonómico</p>
                        <span class="badge bg-success fs-6">S/ 79.00</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Impresora Láser</h5>
                        <p class="card-text text-muted">Wifi - Dúplex</p>
                        <span class="badge bg-success fs-6">S/ 899.00</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Disco SSD 1TB</h5>
                        <p class="card-text text-muted">NVMe - Alta Velocidad</p>
                        <span class="badge bg-success fs-6">S/ 349.00</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="plantilla/plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
